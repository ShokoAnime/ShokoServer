name: Build Release (Stable)

on:
  release:
    types:
      - released

jobs:
  current_info:
    runs-on: ubuntu-latest

    name: Current Information

    outputs:
      tag: ${{ steps.release_info.outputs.tag }}
      tag_major: v${{ steps.release_info.outputs.version_major }}
      tag_minor: v${{ steps.release_info.outputs.version_major }}.${{ steps.release_info.outputs.version_minor }}
      version: ${{ steps.release_info.outputs.version }}
      version_short: ${{ steps.release_info.outputs.version_short }}
      date: ${{ steps.commit_date_iso8601.outputs.date }}
      sha: ${{ github.sha }}
      sha_short: ${{ steps.commit_info.outputs.sha }}

    steps:
      - name: Checkout "${{ github.sha }}"
        uses: actions/checkout@v7
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0 # This is set to download the full git history for the repo

      - name: Get Commit Date (as ISO8601)
        id: commit_date_iso8601
        shell: bash
        env:
          TZ: UTC0
        run: |
          echo "date=$(git --no-pager show -s --date='format-local:%Y-%m-%dT%H:%M:%SZ' --format=%cd ${{ github.sha }})" >> "$GITHUB_OUTPUT"

      - name: Get Current Version
        id: release_info
        uses: revam/gh-action-get-tag-and-version@v3
        with:
          use_tag_ref: "${{ github.ref }}"
          prefix: v
          prefix_regex: "[vV]?"

      - id: commit_info
        name: Shorten Commit Hash
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.sha.substring(0, 7);
            core.setOutput("sha", sha);

  nuget:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dotnet: [ '10.x' ]
        package:
          - Shoko.Abstractions
          - Shoko.QueueProcessor
          - Shoko.BuildTools
          - Shoko.BuildTools.Targets
          - Shoko.BuildTools.Analyzers

    name: Publish ${{ matrix.package }} Nuget

    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout "${{ github.ref }}"
        uses: actions/checkout@v7
        with:
          ref: "${{ github.sha }}"
          fetch-tags: true

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Run dotnet build
        run: dotnet build -c Release ${{ matrix.package }}

      - name: Publish ${{ matrix.package }} Nuget
        uses: ./.github/actions/publish-nuget
        if: ${{ env.NUGET_API_KEY != '' }}
        with:
          project-file-path: ${{ matrix.package }}/${{ matrix.package }}.csproj
          nuget-key: ${{ env.NUGET_API_KEY }}
          tag-format: ${{ matrix.package }}-v*

  webui:
    runs-on: ubuntu-latest

    name: Download Web UI

    steps:
      - name: Get Latest Stable Web UI Release
        id: webui_release
        run: |
          # `--fail` keeps an error body out of `jq`; unchecked, this once resolved to the literal string "null" and curled that.
          download_url=$(curl --fail --silent --show-error https://raw.githubusercontent.com/ShokoAnime/Shoko-WebUI/metadata/manifest.json | jq -r '.Stable[0].downloadUrl')
          if [ -z "${download_url}" ] || [ "${download_url}" = "null" ]; then
            echo "could not resolve the web ui download url" >&2
            exit 1
          fi
          echo "download_url=${download_url}" >> "$GITHUB_OUTPUT"

      - name: Download and Extract Web UI
        run: |
          mkdir -p webui
          curl --fail --location "${{ steps.webui_release.outputs.download_url }}" -o webui/latest.zip
          cd webui
          unzip -o latest.zip
          rm latest.zip

      - name: Upload Web UI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: webui
          path: webui/
          retention-days: 1

  plugins:
    runs-on: ubuntu-latest

    name: Fetch ${{ matrix.plugin }}

    strategy:
      matrix:
        plugin: [ Shoko.Plugin.OfflineImporter, Shoko.Plugin.Tmdb, Shoko.Plugin.WebAOM ]

    steps:
      - name: Checkout "${{ github.ref }}"
        uses: actions/checkout@v7
        with:
          ref: "${{ github.sha }}"

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      # One cache entry per plugin, carried across runs: a release is downloaded
      # once, and a run that cannot reach it falls back to the one before.
      - name: Cache ${{ matrix.plugin }}
        uses: actions/cache@v6
        with:
          path: .cache/plugins/${{ matrix.plugin }}
          key: plugin-${{ matrix.plugin }}-${{ github.run_id }}
          restore-keys: plugin-${{ matrix.plugin }}-

      - name: Fetch and Verify ${{ matrix.plugin }}
        run: dotnet msbuild ReleasedPlugins.targets -t:ShokoFetchReleasedPlugins -p:ShokoReleasedPluginName=${{ matrix.plugin }}

      - name: Upload ${{ matrix.plugin }} Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.plugin }}
          path: .cache/plugins/${{ matrix.plugin }}/
          include-hidden-files: true
          retention-days: 1

  mediainfo:
    runs-on: ubuntu-latest

    name: Download MediaInfo

    steps:
      - name: Checkout "${{ github.ref }}"
        uses: actions/checkout@v7
        with:
          ref: "${{ github.sha }}"

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache MediaInfo
        uses: actions/cache@v6
        with:
          path: .cache/mediainfo
          key: mediainfo-${{ github.run_id }}
          restore-keys: mediainfo-

      - name: Download and Verify MediaInfo
        run: dotnet msbuild MediaInfo.targets -t:_ShokoFetchMediaInfo -p:RuntimeIdentifier=win-x64

      - name: Upload MediaInfo Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mediainfo
          path: .cache/mediainfo/
          include-hidden-files: true
          retention-days: 1

  cli-release:
    runs-on: ubuntu-latest

    needs:
      - current_info
      - nuget
      - webui
      - plugins

    strategy:
      matrix:
        dotnet: ['10.x']
        include:
          - build_type: 'Standalone'
            build_props: '--self-contained true'
            display_id: 'linux-x64'
            rid: 'linux-x64'
          - build_type: 'Standalone'
            build_props: '--self-contained true'
            display_id: 'linux-arm64'
            rid: 'linux-arm64'
          - build_type: 'Framework'
            build_props: '--no-self-contained'
            display_id: 'any-x64'
            rid: 'linux-x64'

    name: Build CLI — ${{ matrix.build_type }} ${{ matrix.display_id }} (Release)

    steps:
      - name: Checkout "${{ github.ref }}"
        uses: actions/checkout@v7
        with:
          ref: "${{ github.sha }}"

      - name: Download Web UI
        uses: actions/download-artifact@v8
        with:
          name: webui
          path: Shoko.Server/webui

      # The released plugins the plugins job fetched, read offline by the build.
      - name: Download Released Plugins
        uses: actions/download-artifact@v8
        with:
          pattern: Shoko.Plugin.*
          path: .cache/plugins

      - name: Replace Sentry DSN and other keys
        shell: pwsh
        run: |
          ./.github/workflows/ReplaceSentryDSN.ps1 -dsn ${{ secrets.SENTRY_DSN }}
          ./.github/workflows/ReplaceAVD3URL.ps1 -url ${{ secrets.AVD3_URL }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
        if: ${{ matrix.rid == 'linux-arm64' }}

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - run: dotnet publish -c Release -r ${{ matrix.rid }} -f net10.0 ${{ matrix.build_props }} Shoko.CLI /p:Version="${{ needs.current_info.outputs.version }}" /p:InformationalVersion="\"channel=stable,commit=${{  needs.current_info.outputs.sha }},tag=${{ needs.current_info.outputs.tag }},date=${{ needs.current_info.outputs.date }},\"" -p:ShokoBundleReleasedPlugins=true -p:ShokoReleasedPluginsOffline=true

      - name: Archive Release
        shell: pwsh
        run: Compress-Archive .\\Shoko.Server\\bin\\Release\\net10.0\\${{matrix.rid}}\\publish .\\Shoko.CLI_${{ matrix.build_type }}_${{ matrix.display_id }}.zip

      - name: Upload Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./Shoko.CLI*.zip
          tag: ${{ needs.current_info.outputs.tag }}
          file_glob: true

  tray-service-framework-cross:
    runs-on: ubuntu-latest

    needs:
      - current_info
      - nuget
      - webui
      - plugins

    strategy:
      matrix:
        rid: ['linux-x64', 'linux-arm64', 'osx-arm64']
        dotnet: ['10.x']

    name: Build Tray Service — Framework ${{ matrix.rid }} (Release)

    steps:
      - name: Checkout "${{ github.ref }}"
        uses: actions/checkout@v7
        with:
          ref: "${{ github.sha }}"

      - name: Download Web UI
        uses: actions/download-artifact@v8
        with:
          name: webui
          path: Shoko.Server/webui

      # The released plugins the plugins job fetched, read offline by the build.
      - name: Download Released Plugins
        uses: actions/download-artifact@v8
        with:
          pattern: Shoko.Plugin.*
          path: .cache/plugins

      - name: Replace Sentry DSN and other keys
        shell: pwsh
        run: |
          ./.github/workflows/ReplaceSentryDSN.ps1 -dsn ${{ secrets.SENTRY_DSN }}
          ./.github/workflows/ReplaceAVD3URL.ps1 -url ${{ secrets.AVD3_URL }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
        if: ${{ matrix.rid == 'linux-arm64' }}

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - run: dotnet publish -c Release -r ${{ matrix.rid }} -f net10.0 --no-self-contained Shoko.TrayService /p:Version="${{ needs.current_info.outputs.version }}" /p:InformationalVersion="\"channel=stable,commit=${{ needs.current_info.outputs.sha }},tag=${{ needs.current_info.outputs.tag }},date=${{ needs.current_info.outputs.date }},\"" -p:ShokoBundleReleasedPlugins=true -p:ShokoReleasedPluginsOffline=true

      - name: Archive Release
        shell: pwsh
        run: Compress-Archive ./Shoko.Server/bin/Release/net10.0/${{ matrix.rid }}/publish ./Shoko.TrayService_Framework_${{ matrix.rid }}.zip

      - name: Upload Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./Shoko.TrayService*.zip
          tag: ${{ needs.current_info.outputs.tag }}
          file_glob: true

  tray-service-framework-windows:
    runs-on: windows-latest

    needs:
      - current_info
      - nuget
      - webui
      - plugins
      - mediainfo

    strategy:
      matrix:
        dotnet: ['10.x']

    name: Build Tray Service — Framework win-x64 (Release)

    steps:
      - name: Checkout "${{ github.ref }}"
        uses: actions/checkout@v7
        with:
          ref: "${{ github.sha }}"

      - name: Download Web UI
        uses: actions/download-artifact@v8
        with:
          name: webui
          path: Shoko.Server/webui

      # The released plugins the plugins job fetched, read offline by the build.
      - name: Download Released Plugins
        uses: actions/download-artifact@v8
        with:
          pattern: Shoko.Plugin.*
          path: .cache/plugins

      - name: Replace Sentry DSN and other keys
        shell: pwsh
        run: |
          .\\.github\\workflows\\ReplaceSentryDSN.ps1 -dsn ${{ secrets.SENTRY_DSN }}
          .\\.github\\workflows\\ReplaceAVD3URL.ps1 -url ${{ secrets.AVD3_URL }}

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Download MediaInfo
        uses: actions/download-artifact@v8
        with:
          name: mediainfo
          path: .cache/mediainfo

      - run: dotnet publish -c Release -r win-x64 --no-self-contained Shoko.TrayService /p:Version="${{ needs.current_info.outputs.version }}" /p:InformationalVersion="channel=stable%2ccommit=${{ github.sha }}%2ctag=${{ needs.current_info.outputs.tag }}%2cdate=${{ needs.current_info.outputs.date }}%2c" # %2c is comma, blame windows/pwsh -p:ShokoBundleReleasedPlugins=true -p:ShokoReleasedPluginsOffline=true

      - name: Archive Release
        shell: pwsh
        run: Compress-Archive .\\Shoko.Server\\bin\\Release\\net10.0\\win-x64\\publish .\\Shoko.TrayService_Framework_win-x64.zip

      - name: Upload Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./Shoko.TrayService*.zip
          tag: ${{ needs.current_info.outputs.tag }}
          file_glob: true

  tray-service-installer:
    runs-on: windows-2022

    needs:
      - current_info
      - nuget
      - webui
      - plugins
      - mediainfo

    strategy:
      matrix:
        dotnet: ['10.x']

    name: Build Tray Service — Installer (Stable)

    steps:
      - name: Checkout "${{ github.ref }}"
        uses: actions/checkout@v7
        with:
          ref: "${{ github.ref }}"

      - name: Download Web UI
        uses: actions/download-artifact@v8
        with:
          name: webui
          path: Shoko.Server/webui

      # The released plugins the plugins job fetched, read offline by the build.
      - name: Download Released Plugins
        uses: actions/download-artifact@v8
        with:
          pattern: Shoko.Plugin.*
          path: .cache/plugins

      - name: Replace Sentry DSN and other keys
        shell: pwsh
        run: |
          .\\.github\\workflows\\ReplaceSentryDSN.ps1 -dsn ${{ secrets.SENTRY_DSN }}
          .\\.github\\workflows\\ReplaceAVD3URL.ps1 -url ${{ secrets.AVD3_URL }}

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Download MediaInfo
        uses: actions/download-artifact@v8
        with:
          name: mediainfo
          path: .cache/mediainfo

      - run: dotnet publish -c Release -r win-x64 --self-contained true Shoko.TrayService /p:Version="${{ needs.current_info.outputs.version }}" /p:InformationalVersion="channel=stable%2ccommit=${{ github.sha }}%2ctag=${{ needs.current_info.outputs.tag }}%2cdate=${{ needs.current_info.outputs.date }}%2c" # %2c is comma, blame windows/pwsh -p:ShokoBundleReleasedPlugins=true -p:ShokoReleasedPluginsOffline=true

      - name: Archive Release
        shell: pwsh
        run: Compress-Archive .\\Shoko.Server\\bin\\Release\\net10.0\\win-x64\\publish .\\Shoko.TrayService_Standalone_win-x64.zip

      - name: Upload Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./Shoko.TrayService*.zip
          tag: ${{ needs.current_info.outputs.tag }}
          file_glob: true

      - name: Build Installer
        run: iscc /O".\\" ".\\Installer\\ShokoServer.iss"

      - name: Upload Installer to GitHub
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./Shoko.Setup.exe
          tag: ${{ needs.current_info.outputs.tag }}
          file_glob: true

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2.8.1
        if: ${{ env.SSH_USERNAME != '' && env.SSH_SERVER != '' }}
        env:
          SSH_USERNAME: ${{ secrets.FILES_USERNAME }}
          SSH_SERVER: ${{ secrets.FILES_SERVER }}
        with:
          key: ${{ secrets.FILES_SSH_KEY }}
          name: files_id_rsa
          known_hosts: ${{ secrets.FILES_KNOWN_HOSTS }}

      - name: Upload Installer to site
        shell: pwsh
        if: ${{ env.SSH_USERNAME != '' && env.SSH_SERVER != '' }}
        env:
          SSH_USERNAME: ${{ secrets.FILES_USERNAME }}
          SSH_SERVER: ${{ secrets.FILES_SERVER }}
        run:
          .\\.github\\workflows\\UploadRelease.ps1 -remote "ShokoServer-${{ needs.current_info.outputs.version_short }}-Win.exe" -local "Shoko.Setup.exe";

  docker-release-build:
    runs-on: ubuntu-latest

    needs:
      - current_info
      - nuget
      - webui
      - plugins

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: 'amd64'
            dockerfile: 'Dockerfile'

          - arch: 'arm64'
            dockerfile: 'Dockerfile.aarch64'

    name: Build Docker Image - ${{ matrix.arch }} (Release)

    steps:
      - name: Checkout "${{ github.ref }}"
        uses: actions/checkout@v7
        with:
          ref: "${{ github.ref }}"

      - name: Download Web UI
        uses: actions/download-artifact@v8
        with:
          name: webui
          path: Shoko.Server/webui

      # The released plugins the plugins job fetched, read offline by the build.
      - name: Download Released Plugins
        uses: actions/download-artifact@v8
        with:
          pattern: Shoko.Plugin.*
          path: .cache/plugins

      - name: Replace Sentry DSN and other keys
        shell: pwsh
        run: |
          ./.github/workflows/ReplaceSentryDSN.ps1 -dsn ${{ secrets.SENTRY_DSN }}
          ./.github/workflows/ReplaceAVD3URL.ps1 -url ${{ secrets.AVD3_URL }}

      - uses: docker/setup-qemu-action@v4
        name: Set up QEMU
        with:
          platforms: arm64
        if: ${{ matrix.arch == 'arm64' }}

      - uses: docker/setup-buildx-action@v4
        name: Set up Docker Buildx

      - uses: docker/login-action@v4
        name: Log into GitHub Container Registry
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        name: Log into Docker Hub
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Disabled provenance for now, until it works with docker manifest create.
      # The manifest list produced by the new feature is incompatible with the
      # expected format used in the docker manifest create command.
      - uses: docker/build-push-action@v7
        name: Build and Push the Docker image
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ secrets.DOCKER_REPO }}:latest-${{ matrix.arch }}
            ghcr.io/${{ secrets.DOCKER_REPO }}:${{ needs.current_info.outputs.tag }}-${{ matrix.arch }}
            ghcr.io/${{ secrets.DOCKER_REPO }}:${{ needs.current_info.outputs.tag_major }}-${{ matrix.arch }}
            ghcr.io/${{ secrets.DOCKER_REPO }}:${{ needs.current_info.outputs.tag_minor }}-${{ matrix.arch }}
            ${{ secrets.DOCKER_REPO }}:latest-${{ matrix.arch }}
            ${{ secrets.DOCKER_REPO }}:${{ needs.current_info.outputs.tag }}-${{ matrix.arch }}
            ${{ secrets.DOCKER_REPO }}:${{ needs.current_info.outputs.tag_major }}-${{ matrix.arch }}
            ${{ secrets.DOCKER_REPO }}:${{ needs.current_info.outputs.tag_minor }}-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            bundle_plugins=true
            plugins_offline=true
            version=${{ needs.current_info.outputs.version }}
            channel=stable
            commit=${{ github.sha }}
            date=${{ needs.current_info.outputs.date }}
            tag=${{ needs.current_info.outputs.tag }}
          provenance: false

  docker-release-push_manifest:
    runs-on: ubuntu-latest

    needs:
      - current_info
      - docker-release-build

    name: Push combined tag "${{ matrix.tag }}" for both images

    strategy:
      fail-fast: false
      matrix:
        tag:
          - latest
          - ${{ needs.current_info.outputs.tag }}
          - ${{ needs.current_info.outputs.tag_major }}
          - ${{ needs.current_info.outputs.tag_minor }}

    steps:
      - uses: docker/login-action@v4
        name: Log into GitHub Container Registry
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        name: Log into Docker Hub
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create manifest
        run: |
          docker manifest create ghcr.io/${{ secrets.DOCKER_REPO }}:${{ matrix.tag }} --amend ghcr.io/${{ secrets.DOCKER_REPO }}:${{ matrix.tag }}-amd64 --amend ghcr.io/${{ secrets.DOCKER_REPO }}:${{ matrix.tag }}-arm64
          docker manifest create ${{ secrets.DOCKER_REPO }}:${{ matrix.tag }} --amend ${{ secrets.DOCKER_REPO }}:${{ matrix.tag }}-amd64 --amend ${{ secrets.DOCKER_REPO }}:${{ matrix.tag }}-arm64

      - name: Push manifest
        run: |
          docker manifest push ghcr.io/${{ secrets.DOCKER_REPO }}:${{ matrix.tag }}
          docker manifest push ${{ secrets.DOCKER_REPO }}:${{ matrix.tag }}

  update-manifest:
    runs-on: ubuntu-latest

    needs:
      - current_info
      - cli-release
      - tray-service-framework-windows
      - tray-service-framework-cross
      - tray-service-installer
      - docker-release-build
      - docker-release-push_manifest

    name: Update Stable Manifest

    steps:
      - uses: actions/checkout@v7
        with:
          path: master-branch
      - uses: actions/checkout@v7
        with:
          ref: metadata
          path: metadata-branch
      - name: Build entry JSON
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          jq -n \
            --arg version "${{ needs.current_info.outputs.version }}" \
            --arg tag "${{ needs.current_info.outputs.tag }}" \
            --arg commit "${{ github.sha }}" \
            --arg downloadUrl "https://github.com/${{ github.repository }}/releases/download/${{ needs.current_info.outputs.tag }}/Shoko.CLI_Framework_any-x64.zip" \
            --arg date "${{ needs.current_info.outputs.date }}" \
            --arg releaseNotes "$RELEASE_BODY" \
            '{version: $version, tag: $tag, commit: $commit, downloadUrl: $downloadUrl, date: $date, releaseNotes: $releaseNotes}' \
            > /tmp/entry.json
      - name: Update manifest
        run: |
          node master-branch/.github/workflows/update-manifest.mjs \
            "$(pwd)/metadata-branch/manifest.json" \
            "$(cat /tmp/entry.json)" \
            Stable
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "repo(manifest): update stable manifest [skip ci]"
          branch: metadata
          repository: metadata-branch
          file_pattern: manifest.json

  sentry-upload:
    runs-on: ubuntu-latest

    needs:
      - current_info
      - update-manifest

    name: Upload version info to Sentry.io

    steps:
      - name: Checkout "${{ github.ref }}"
        uses: actions/checkout@v7
        with:
          ref: "${{ github.ref }}"

      - name: Push Sentry release "${{ needs.current_info.outputs.version }}"
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # SENTRY_URL: https://sentry.io/
        with:
          environment: 'stable'
          version: ${{ needs.current_info.outputs.version }}

  cleanup-artifacts:
    runs-on: ubuntu-latest

    name: Remove Build Artifacts

    needs:
      - sentry-upload

    steps:
      - name: Remove Web UI Artifact
        uses: geekyeggo/delete-artifact@v6
        with:
          name: webui

      - name: Remove Released Plugin Artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: Shoko.Plugin.*

      - name: Remove MediaInfo Artifact
        uses: geekyeggo/delete-artifact@v6
        with:
          name: mediainfo

