name: Unit Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Unit Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      # These suites are self-contained: no database, no network, and no native
      # dependencies, so they need none of the setup the integration tests do.
      - name: Run unit tests
        run: dotnet test Shoko.Tests/Shoko.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Run queue processor tests
        run: dotnet test Shoko.QueueProcessor.Tests/Shoko.QueueProcessor.Tests.csproj -c Release --logger "console;verbosity=normal"

  # The same suites on Windows, where the file system code takes its own paths: handles instead of
  # statx, typed symbolic links, volume serial numbers, long paths. Tests that make symbolic links
  # skip themselves without developer mode or admin rights.
  test-windows:
    runs-on: windows-latest
    name: Unit Tests (Windows)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Run unit tests
        run: dotnet test Shoko.Tests/Shoko.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Run queue processor tests
        run: dotnet test Shoko.QueueProcessor.Tests/Shoko.QueueProcessor.Tests.csproj -c Release --logger "console;verbosity=normal"
